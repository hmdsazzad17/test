<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Earn Online</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        primary: {
                            DEFAULT: "hsl(var(--primary))",
                            foreground: "hsl(var(--primary-foreground))",
                        },
                        secondary: {
                            DEFAULT: "hsl(var(--secondary))",
                            foreground: "hsl(var(--secondary-foreground))",
                        },
                        destructive: {
                            DEFAULT: "hsl(var(--destructive))",
                            foreground: "hsl(var(--destructive-foreground))",
                        },
                        muted: {
                            DEFAULT: "hsl(var(--muted))",
                            foreground: "hsl(var(--muted-foreground))",
                        },
                        accent: {
                            DEFAULT: "hsl(var(--accent))",
                            foreground: "hsl(var(--accent-foreground))",
                        },
                        popover: {
                            DEFAULT: "hsl(var(--popover))",
                            foreground: "hsl(var(--popover-foreground))",
                        },
                        card: {
                            DEFAULT: "hsl(var(--card))",
                            foreground: "hsl(var(--card-foreground))",
                        },
                    },
                    borderRadius: {
                        lg: "var(--radius)",
                        md: "calc(var(--radius) - 2px)",
                        sm: "calc(var(--radius) - 4px)",
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 224 71.4% 4.1%;
            --card: 0 0% 100%;
            --card-foreground: 224 71.4% 4.1%;
            --popover: 0 0% 100%;
            --popover-foreground: 224 71.4% 4.1%;
            --primary: 262.1 83.3% 57.8%;
            --primary-foreground: 210 20% 98%;
            --secondary: 220 14.3% 95.9%;
            --secondary-foreground: 220.9 39.3% 11%;
            --muted: 220 14.3% 95.9%;
            --muted-foreground: 220 8.9% 46.1%;
            --accent: 220 14.3% 95.9%;
            --accent-foreground: 220.9 39.3% 11%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 20% 98%;
            --border: 220 13% 91%;
            --input: 220 13% 91%;
            --ring: 262.1 83.3% 57.8%;
            --radius: 0.5rem;
        }

        .dark {
            --background: 224 71.4% 4.1%;
            --foreground: 210 20% 98%;
            --card: 224 71.4% 4.1%;
            --card-foreground: 210 20% 98%;
            --popover: 224 71.4% 4.1%;
            --popover-foreground: 210 20% 98%;
            --primary: 263.4 70% 50.4%;
            --primary-foreground: 210 20% 98%;
            --secondary: 215 27.9% 16.9%;
            --secondary-foreground: 210 20% 98%;
            --muted: 215 27.9% 16.9%;
            --muted-foreground: 217.9 10.6% 64.9%;
            --accent: 215 27.9% 16.9%;
            --accent-foreground: 210 20% 98%;
            --destructive: 0 62.8% 30.6%;
            --destructive-foreground: 210 20% 98%;
            --border: 215 27.9% 16.9%;
            --input: 215 27.9% 16.9%;
            --ring: 263.4 70% 50.4%;
        }

        * {
            border-color: hsl(var(--border));
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
        }

        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .sidebar-link.active {
            background-color: hsla(262, 83%, 58%, 0.1);
            color: hsl(var(--primary));
        }

        .sidebar-link.active i {
            color: hsl(var(--primary));
        }
    </style>
</head>

        const views = {

                        <div class="bg-card border rounded-xl p-6 shadow-sm">
                            <div class="flex items-center justify-between pb-2">
                                <h3 class="text-sm font-medium text-muted-foreground">Today's Earnings</h3>

                            </div>
                            <div class="flex items-baseline justify-between">
                                <div class="text-2xl font-bold">$8.90</div>
                                <span class="text-xs font-medium text-emerald-500">+2.1%</span>
                            </div>
                        </div>
                        <div class="bg-card border rounded-xl p-6 shadow-sm">
                            <div class="flex items-center justify-between pb-2">
                                <h3 class="text-sm font-medium text-muted-foreground">Active Plan</h3>
                                <i data-lucide="arrow-up-right" class="w-4 h-4 text-muted-foreground"></i>
                            </div>

                            </div>
                        </div>
                    </div>

                    <div class="grid gap-4 md:grid-cols-7">
                        <div class="md:col-span-4 bg-card border rounded-xl shadow-sm overflow-hidden">
                            <div class="p-6 border-b">
                                <h3 class="font-semibold">Earnings Overview</h3>

                return `

        function switchView(viewName) {
            if (!views[viewName]) return;
            
            // Update Active Link (Desktop)
            document.querySelectorAll('#sidebar-nav .sidebar-link').forEach(el => {
                el.classList.toggle('active', el.getAttribute('data-view') === viewName);
            });
            // Update Active Link (Mobile)
            document.querySelectorAll('#mobile-sidebar .sidebar-link').forEach(el => {
                el.classList.toggle('active', el.getAttribute('data-view') === viewName);
            });

            // Update UI
            state.currentView = viewName;
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = views[viewName]();
            
            // Update Header Title
            const titles = { overview: 'Dashboard Overview', ads: 'PTC Advertisements', plans: 'Earning Plans', wallet: 'Wallet & Payouts', settings: 'Account Settings' };
            document.getElementById('page-title').textContent = titles[viewName] || 'Dashboard';
            
            // Re-init icons
            lucide.createIcons();
            
            // If overview, init chart
            if (viewName === 'overview') initChart();
            
            // Close mobile menu if open
            closeMobileMenu();
        }

        function initChart() {
            const ctx = document.getElementById('earningsChart');
            if (!ctx) return;
            
            const gradient = ctx.getContext('2d').createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(124, 58, 237, 0.3)');
            gradient.addColorStop(1, 'rgba(124, 58, 237, 0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: 'Earnings',
                        data: [4.5, 6.2, 5.8, 8.9, 7.4, 10.5, 9.2],
                        borderColor: '#7c3aed',
                        borderWidth: 3,
                        backgroundColor: gradient,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#7c3aed',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            grid: { borderDash: [5, 5], color: 'rgba(0,0,0,0.05)' },
                            ticks: { callback: value => '$' + value, font: { family: 'Inter', size: 10 } }
                        },
                        x: { grid: { display: false }, ticks: { font: { family: 'Inter', size: 10 } } }
                    }
                }
            });
        }

        let adTimer = null;
        function startAd(id, duration) {
            const timerOverlay = document.getElementById('ad-timer');
            const timerCount = document.getElementById('timer-count');
            
            timerOverlay.classList.remove('hidden');
            timerOverlay.classList.add('flex');
            
            let timeLeft = duration;
            timerCount.textContent = timeLeft + 's';
            
            adTimer = setInterval(() => {
                timeLeft--;
                timerCount.textContent = timeLeft + 's';
                
                if (timeLeft <= 0) {
                    clearInterval(adTimer);
                    completeAd(id);
                }
            }, 1000);
        }

        function completeAd(id) {
            const ad = state.ads.find(a => a.id === id);
            if (ad) {
                ad.status = 'completed';
                state.balance += ad.reward;
                
                // Update Balance UI
                document.getElementById('top-balance').textContent = '$' + state.balance.toFixed(2);
                
                // Hide Timer
                const timerOverlay = document.getElementById('ad-timer');
                timerOverlay.classList.add('hidden');
                
                // Refresh View
                switchView('ads');
                
                // Show success notification (simplified)
                alert(`Earnings Credited! You earned $${ad.reward.toFixed(2)}`);
            }
        }

        // Mobile Menu Toggles
        const mobileToggle = document.getElementById('mobile-menu-toggle');
        const mobileSidebar = document.getElementById('mobile-sidebar');
        const mobileSidebarContent = document.getElementById('mobile-sidebar-content');
        const closeMobile = document.getElementById('close-mobile-sidebar');

        function openMobileMenu() {
            mobileSidebar.classList.remove('hidden');
            setTimeout(() => {
                mobileSidebar.classList.remove('opacity-0');
                mobileSidebarContent.classList.remove('translate-x-full');
            }, 10);
        }

        function closeMobileMenu() {
            mobileSidebarContent.classList.add('translate-x-full');
            mobileSidebar.classList.add('opacity-0');
            setTimeout(() => {
                mobileSidebar.classList.add('hidden');
            }, 300);
        }

        mobileToggle.addEventListener('click', openMobileMenu);
        closeMobile.addEventListener('click', closeMobileMenu);
        mobileSidebar.addEventListener('click', (e) => {
            if (e.target === mobileSidebar) closeMobileMenu();
        });

        // Initialize First View
        window.addEventListener('load', () => {
            switchView('overview');
            
            // Add click events to sidebar buttons
            document.querySelectorAll('.sidebar-link[data-view]').forEach(btn => {
                btn.addEventListener('click', () => {
                    switchView(btn.getAttribute('data-view'));
                });
            });
        });
    </script>
